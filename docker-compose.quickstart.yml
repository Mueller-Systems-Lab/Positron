services:
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?quickstart credentials are missing}"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?quickstart credentials are missing}", "--protected-mode", "yes"]
    volumes:
      - quickstart-redis-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: Dockerfile.quickstart
      target: server-runtime
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      POSITRON_DB_PATH: /app/.positron/runs/positron.db
      POSITRON_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      POSITRON_GITHUB_MODE: fake
      POSITRON_SPECKIT_MODE: fake
      POSITRON_OPENCODE_MODE: fake
      POSITRON_REPO_OWNER: demo
      POSITRON_REPO_NAME: positron-demo
      POSITRON_REPO_DEFAULT_BRANCH: main
      POSITRON_ENABLE_PUSH: "false"
      POSITRON_ENABLE_MERGE: "false"
      POSITRON_MERGE_DRY_RUN: "true"
      POSITRON_MERGE_KILL_SWITCH: "true"
      POSITRON_ENABLE_FIX_LOOP: "false"
      POSITRON_ENABLE_DEMO_LIVE: "1"
      POSITRON_ADMIN_TOKEN: "${POSITRON_ADMIN_TOKEN:?quickstart credentials are missing}"
      POSITRON_CORS_ORIGIN: http://localhost:5173
      GITHUB_TOKEN: ""
    volumes:
      - quickstart-positron-data:/app/.positron
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.quickstart
      target: worker-runtime
    environment:
      NODE_ENV: production
      POSITRON_DB_PATH: /app/.positron/runs/positron.db
      POSITRON_REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      POSITRON_GITHUB_MODE: fake
      POSITRON_SPECKIT_MODE: fake
      POSITRON_OPENCODE_MODE: fake
      POSITRON_REPO_OWNER: demo
      POSITRON_REPO_NAME: positron-demo
      POSITRON_REPO_DEFAULT_BRANCH: main
      POSITRON_ENABLE_PUSH: "false"
      POSITRON_ENABLE_MERGE: "false"
      POSITRON_MERGE_DRY_RUN: "true"
      POSITRON_MERGE_KILL_SWITCH: "true"
      POSITRON_ENABLE_FIX_LOOP: "false"
      POSITRON_ADMIN_TOKEN: "${POSITRON_ADMIN_TOKEN:?quickstart credentials are missing}"
      GITHUB_TOKEN: ""
    volumes:
      - quickstart-positron-data:/app/.positron
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

  nginx:
    image: nginx:alpine
    user: "101:101"
    ports:
      - "5173:5173"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=755
      - /run:uid=101,gid=101,mode=755
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  quickstart-positron-data:
  quickstart-redis-data:
