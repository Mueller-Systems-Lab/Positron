name: Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Base SHA for comparison (default: HEAD~1 on main)'
        required: false
        default: ''

permissions:
  contents: read
  actions: write

jobs:
  # ── Format Gate (blocking, all files) ──────────────────────────────
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check (Biome)
        run: npx biome format .

  # ── Differential Lint (blocking, true BASE vs HEAD comparison) ─────
  # Compares Biome diagnostics between BASE and HEAD for all lintable files.
  # Uses scripts/ci/differential-biome-lint.mjs (counted multiset, rename-aware,
  # fail-closed, full repository-relative paths, config-change detection).
  # Blocks on NEW or WORSENED diagnostics. Passes on REMOVED/UNCHANGED/IMPROVED.
  # Relates to #340. Follow-up to #268.
  differential-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine SHAs from event context
        id: shas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ inputs.base_sha }}" >> "$GITHUB_OUTPUT"
            echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          echo "event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"

      - name: Test differential lint engine
        run: node --test scripts/ci/differential-biome-lint.test.mjs

      - name: Run differential Biome lint
        id: diff
        run: |
          BIOME_BIN="${{ github.workspace }}/node_modules/@biomejs/biome/bin/biome"
          node scripts/ci/differential-biome-lint.mjs \
            --base "${{ steps.shas.outputs.base }}" \
            --head "${{ steps.shas.outputs.head }}" \
            --event "${{ steps.shas.outputs.event }}" \
            --repo-root "${{ github.workspace }}" \
            --biome-bin "$BIOME_BIN" \
            --summary "${{ github.step_summary }}"

      - name: Publish differential lint summary
        if: always()
        run: |
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Event | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BASE | \`${{ steps.shas.outputs.base }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HEAD | \`${{ steps.shas.outputs.head }}\` |" >> "$GITHUB_STEP_SUMMARY"

  # ── Build (blocking, independent of lint) ──────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Typecheck (blocking, independent of lint) ──────────────────────
  typecheck:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ── Unit Tests (blocking, depends on build) ────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (reuse cache)
        run: npm run build

      - name: Unit Tests
        run: npm test

  # ── Full Repository Lint Report (advisory, transparent baseline) ───
  full-lint-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full repository lint (advisory)
        id: lint
        run: |
          npx biome lint . 2>&1 | tee /tmp/full-lint.log && echo "exit=0" >> "$GITHUB_OUTPUT" || echo "exit=1" >> "$GITHUB_OUTPUT"
          echo "checked=$(grep -oP 'Checked \K\d+' /tmp/full-lint.log || echo 0)" >> "$GITHUB_OUTPUT"
          echo "errors=$(grep -oP 'Found \K\d+(?= error)' /tmp/full-lint.log || echo 0)" >> "$GITHUB_OUTPUT"
          echo "warnings=$(grep -oP 'Found \K\d+(?= warning)' /tmp/full-lint.log || echo 0)" >> "$GITHUB_OUTPUT"
          hidden=$(grep -oP 'Diagnostics not shown: \K\d+' /tmp/full-lint.log || echo 0)
          echo "hidden=${hidden}" >> "$GITHUB_OUTPUT"

      - name: Post lint summary
        if: always()
        run: |
          { echo "## Full Repository Lint Report (advisory)"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Checked files | ${{ steps.lint.outputs.checked }} |"
            echo "| Errors | ${{ steps.lint.outputs.errors }} |"
            echo "| Warnings | ${{ steps.lint.outputs.warnings }} |"
            echo "| Diagnostics hidden | ${{ steps.lint.outputs.hidden }} |"
            echo ""
            echo "> This report is advisory. The blocking **differential-lint** job enforces"
            echo "> NEW/WORSENED diagnostics on changed files only."
            echo "> The known backlog is tracked in Issue [#340](https://github.com/xxammaxx/Positron/issues/340)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── #223: Tool Gateway Windows Path Tests (non-blocking) ──────
  tool-gateway-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npm run build

      - name: Run Tool Gateway tests
        run: npx vitest run
        working-directory: packages/tool-gateway

  observability-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          python3 -c "import yaml; yaml.safe_load(open('observability/prometheus/prometheus.yml'))" && echo "✅ prometheus.yml valid YAML"
          python3 -c "import yaml; yaml.safe_load(open('observability/prometheus/alerts.yml'))" && echo "✅ alerts.yml valid YAML"
          python3 -c "import yaml; yaml.safe_load(open('observability/alertmanager/alertmanager.yml'))" && echo "✅ alertmanager.yml valid YAML"

      - name: Validate Prometheus Config (promtool)
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/observability/prometheus/prometheus.yml:/tmp/prometheus.yml:ro \
            -v ${{ github.workspace }}/observability/prometheus/alerts.yml:/tmp/alerts.yml:ro \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /tmp/prometheus.yml

      - name: Validate Alert Rules (promtool)
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/observability/prometheus/alerts.yml:/tmp/alerts.yml:ro \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules /tmp/alerts.yml

      - name: Validate Alertmanager Config (amtool)
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/observability/alertmanager/alertmanager.yml:/tmp/alertmanager.yml:ro \
            --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /tmp/alertmanager.yml

  mutation-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (required for Stryker)
        run: npm run build

      - name: Ensure test results directory
        run: mkdir -p test-results

      - name: Run fast mutation tests (Stryker)
        run: npm run test:mutation:fast

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-fast-report
          path: |
            reports/mutation/**
          if-no-files-found: warn

  mutation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (required for Stryker)
        run: npm run build

      - name: Ensure test results directory
        run: mkdir -p test-results

      - name: Run safety mutation tests (Stryker)
        run: npm run test:mutation:safety

      - name: Upload mutation safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-safety-report
          path: |
            reports/mutation/safety-baseline/**
          if-no-files-found: warn

  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (required for server webServer via tsx)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          VITEST: 'true'
          NODE_ENV: test
          POSITRON_DISABLE_QUEUE: 'true'
          POSITRON_GITHUB_MODE: fake
          POSITRON_OPENCODE_MODE: fake
          POSITRON_SPECKIT_MODE: fake
          GITHUB_TOKEN: ''
          POSITRON_REPO_OWNER: test-owner
          POSITRON_REPO_NAME: test-repo
          POSITRON_REPO_DEFAULT_BRANCH: main
          POSITRON_ADMIN_TOKEN: positron-test-token-dev

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: warn
