name: Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # ── Format Gate (blocking, all files) ──────────────────────────────
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check (Biome)
        run: npx biome format .

  # ── Differential Lint (blocking, only changed TS/TSX files) ────────
  # Compares HEAD against the PR base (or parent commit on push to main).
  # Blocks only on NEW or WORSENED diagnostics in changed files.
  differential-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed TypeScript files
        id: changed
        run: |
          git diff --name-only --diff-filter=AMRT "${{ steps.base.outputs.ref }}...HEAD" -- '*.ts' '*.tsx' ':!.d.ts' > /tmp/changed-ts.txt || true
          if [ -s /tmp/changed-ts.txt ]; then
            echo "=== Changed TypeScript files ==="
            cat /tmp/changed-ts.txt
            echo "count=$(wc -l < /tmp/changed-ts.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "No TypeScript files changed in this PR."
            echo "count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Differential Biome lint
        if: steps.changed.outputs.count != '0'
        run: |
          # Use NUL-separated paths to handle filenames with spaces safely
          while IFS= read -r file; do
            [ -f "$file" ] && printf '%s\0' "$file"
          done < /tmp/changed-ts.txt > /tmp/changed-ts.null || true
          if [ -s /tmp/changed-ts.null ]; then
            echo "Running Biome lint on changed files..."
            xargs -0 npx biome lint < /tmp/changed-ts.null
          fi

  # ── Build (blocking, independent) ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Typecheck (blocking, independent) ──────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ── Unit Tests (blocking, depends on build) ────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (reuse cached artifacts)
        run: npm run build

      - name: Unit Tests
        run: npm test

  # ── Full Repository Lint Report (advisory, transparent baseline) ───
  # Non-blocking: shows the full lint state including known backlog.
  # Differential-lint (above) is the blocking gate for new changes.
  full-lint-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: format-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Full repository lint (advisory)
        id: lint
        run: |
          npx biome lint . 2>&1 | tee /tmp/full-lint.log || true
          echo "checked=$(grep -oP 'Checked \K\d+' /tmp/full-lint.log || echo 0)" >> "$GITHUB_OUTPUT"
          echo "errors=$(grep -oP 'Found \K\d+(?= error)' /tmp/full-lint.log || echo 0)" >> "$GITHUB_OUTPUT"
          echo "warnings=$(grep -oP 'Found \K\d+(?= warning)' /tmp/full-lint.log || echo 0)" >> "$GITHUB_OUTPUT"
          hidden=$(grep -oP 'Diagnostics not shown: \K\d+' /tmp/full-lint.log || echo 0)
          echo "hidden=${hidden}" >> "$GITHUB_OUTPUT"

      - name: Post lint summary
        if: always()
        run: |
          {
            echo "## Full Repository Lint Report (advisory)"
            echo ""
            echo "| Metric | Count |"
            echo "|--------|-------|"
            echo "| Checked files | ${{ steps.lint.outputs.checked }} |"
            echo "| Errors | ${{ steps.lint.outputs.errors }} |"
            echo "| Warnings | ${{ steps.lint.outputs.warnings }} |"
            echo "| Diagnostics hidden | ${{ steps.lint.outputs.hidden }} |"
            echo ""
            echo "> This report is advisory. The blocking **differential-lint** job enforces"
            echo "> NEW/WORSENED diagnostics on changed files only."
            echo "> The known backlog is tracked in Issue #340."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── #223: Tool Gateway Windows Path Tests (non-blocking) ──────
  # Runs path traversal tests on Windows to validate cross-platform
  # path separator handling (backslash vs forward slash).
  tool-gateway-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dependencies
        run: npm run build

      - name: Run Tool Gateway tests
        run: npx vitest run
        working-directory: packages/tool-gateway

  observability-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: |
          python3 -c "import yaml; yaml.safe_load(open('observability/prometheus/prometheus.yml'))" && echo "✅ prometheus.yml valid YAML"
          python3 -c "import yaml; yaml.safe_load(open('observability/prometheus/alerts.yml'))" && echo "✅ alerts.yml valid YAML"
          python3 -c "import yaml; yaml.safe_load(open('observability/alertmanager/alertmanager.yml'))" && echo "✅ alertmanager.yml valid YAML"

      - name: Validate Prometheus Config (promtool)
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/observability/prometheus/prometheus.yml:/tmp/prometheus.yml:ro \
            -v ${{ github.workspace }}/observability/prometheus/alerts.yml:/tmp/alerts.yml:ro \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /tmp/prometheus.yml

      - name: Validate Alert Rules (promtool)
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/observability/prometheus/alerts.yml:/tmp/alerts.yml:ro \
            --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules /tmp/alerts.yml

      - name: Validate Alertmanager Config (amtool)
        continue-on-error: true
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/observability/alertmanager/alertmanager.yml:/tmp/alertmanager.yml:ro \
            --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /tmp/alertmanager.yml

  mutation-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (required for Stryker)
        run: npm run build

      - name: Ensure test results directory
        run: mkdir -p test-results

      - name: Run fast mutation tests (Stryker)
        run: npm run test:mutation:fast

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-fast-report
          path: |
            reports/mutation/**
          if-no-files-found: warn

  # ── QA-007: Mutation Safety Baseline (non-blocking) ──────────────
  # Targets 7 safety-critical modules only. Fast runtime (~34s).
  # Non-blocking: baseline only — will be hardened in QA-008.
  mutation-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (required for Stryker)
        run: npm run build

      - name: Ensure test results directory
        run: mkdir -p test-results

      - name: Run safety mutation tests (Stryker)
        run: npm run test:mutation:safety

      - name: Upload mutation safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-safety-report
          path: |
            reports/mutation/safety-baseline/**
          if-no-files-found: warn

  # ── QA-030: Playwright E2E (non-blocking, optional) ─────────────
  # Non-blocking until E2E stability window completed:
  #   Criteria: ≥ 5 consecutive green runs on main
  #   Tracked in: docs/qa-tooling.md#e2e-stability-window
  #   After 5/5: promote to blocking (continue-on-error: false)
  e2e-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (required for server webServer via tsx)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          # Fake/Safety-Env — no real tokens, no external API calls
          VITEST: 'true'
          NODE_ENV: test
          POSITRON_DISABLE_QUEUE: 'true'
          POSITRON_GITHUB_MODE: fake
          POSITRON_OPENCODE_MODE: fake
          POSITRON_SPECKIT_MODE: fake
          GITHUB_TOKEN: ''
          # Repository config (fake mode requires these)
          POSITRON_REPO_OWNER: test-owner
          POSITRON_REPO_NAME: test-repo
          POSITRON_REPO_DEFAULT_BRANCH: main
          # Admin token (used for protected endpoints in test mode)
          POSITRON_ADMIN_TOKEN: positron-test-token-dev

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/**
            test-results/**
          if-no-files-found: warn
